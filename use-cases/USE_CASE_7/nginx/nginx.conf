events {
    worker_connections 1024;
}

http {
    # Bundle de CAs españolas de confianza para validar certificados cliente
    # Generado por certificates/spanish-cas/download-cas.sh
    ssl_client_certificate /etc/nginx/ssl/spanish-cas/spanish-cas-bundle.pem;

    # "optional" = pide certificado pero no obliga en todas las rutas
    # "optional_no_ca" = acepta cualquier cert (útil para desarrollo/pruebas)
    ssl_verify_client optional;
    ssl_verify_depth 5;

    server {
        listen 443 ssl;
        server_name localhost;

        # Certificado TLS del servidor (auto-firmado para desarrollo)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # ── Portal estático (no requiere certificado) ────────────────────
        location / {
            root  /usr/share/nginx/html;
            index portal-certificado.html;
            try_files $uri $uri/ /portal-certificado.html;
        }

        # ── Rutas de Keycloak (requieren certificado para el auth flow) ──
        location /realms/ {
            # Pasar el certificado del cliente a Keycloak como header URL-encoded
            proxy_set_header ssl-client-cert       $ssl_client_escaped_cert;
            proxy_set_header ssl-client-verify     $ssl_client_verify;
            proxy_set_header ssl-client-s-dn       $ssl_client_s_dn;
            proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto     https;
            proxy_set_header Host                  $host;

            proxy_pass http://keycloak:8080;
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }

        location /resources/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
        }

        location /js/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
        }

        # Admin console (sin requisito de certificado cliente)
        location /admin/ {
            proxy_pass         http://keycloak:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
