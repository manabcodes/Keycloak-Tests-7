server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Headers para evitar caché - más agresivos
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Last-Modified "" always;
    add_header ETag "" always;

    # Ruta raíz - sirve index.html
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Portal de empleados
    location /portal {
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Aplicación de proyectos
    location /proyectos {
        try_files $uri $uri/ /proyectos/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Panel de administración
    location /admin {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Aplicación cliente (realm diferente)
    location /cliente {
        try_files $uri $uri/ /cliente/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }
}
