<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Last-Modified" content="0" />
  <title>Portal de Empleados - SSO Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 32px;
      border-radius: 16px;
      color: #333;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #667eea; margin-top: 0; }
    .user-info {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }
    .roles {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .role-badge {
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
      margin-top: 8px;
    }
    button:hover { background: #5568d3; }
    .status { margin: 16px 0; padding: 12px; border-radius: 8px; }
    .status.info { background: #e3f2fd; color: #1976d2; }
    .status.error { background: #ffebee; color: #c62828; }
    .apps-links {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 2px solid #eee;
    }
    .apps-links a {
      display: inline-block;
      margin: 8px 8px 8px 0;
      padding: 8px 16px;
      background: #f0f0f0;
      color: #667eea;
      text-decoration: none;
      border-radius: 6px;
      border: 2px solid #667eea;
    }
    .apps-links a:hover {
      background: #667eea;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portal de Empleados</h1>
    <div id="status" class="status info">Inicializando...</div>
    <div id="user-info" style="display:none;">
      <div class="user-info">
        <h3>Información del Usuario</h3>
        <p><strong>Nombre:</strong> <span id="user-name"></span></p>
        <p><strong>Email:</strong> <span id="user-email"></span></p>
        <p><strong>Usuario:</strong> <span id="user-username"></span></p>
        <div>
          <strong>Roles:</strong>
          <div class="roles" id="user-roles"></div>
        </div>
      </div>
      <button id="btn-refresh">Refrescar Token</button>
      <button id="btn-logout">Cerrar Sesión</button>
    </div>
    <div class="apps-links">
      <h3>Otras Aplicaciones (SSO)</h3>
      <a href="http://localhost:3000/proyectos" id="link-proyectos">Gestión de Proyectos</a>
      <a href="http://localhost:3000/admin" id="link-admin">Panel de Administración</a>
    </div>
  </div>

  <script>
    const issuer = "http://localhost:8080/realms/empresa-realm";
    const clientId = "portal-empleados";
    const redirectUri = window.location.origin + window.location.pathname;
    const scope = "openid profile email";

    const OIDC = {
      auth: issuer + "/protocol/openid-connect/auth",
      token: issuer + "/protocol/openid-connect/token",
      logout: issuer + "/protocol/openid-connect/logout",
      userinfo: issuer + "/protocol/openid-connect/userinfo"
    };

    const statusEl = document.getElementById("status");
    const userInfoEl = document.getElementById("user-info");

    function base64url(arrBuf) {
      return btoa(String.fromCharCode(...new Uint8Array(arrBuf)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    async function sha256(str) {
      const enc = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest("SHA-256", enc);
      return base64url(hash);
    }
    function randString(len=64) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
      let s = ""; for (let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
      return s;
    }
    function parseJWT(t) {
      try { return JSON.parse(atob(t.split(".")[1])); } catch { return {}; }
    }
    function setStatus(msg, isError = false) {
      statusEl.className = `status ${isError ? 'error' : 'info'}`;
      statusEl.textContent = msg;
    }

    const store = {
      set(k,v){ sessionStorage.setItem(k, JSON.stringify(v)); },
      get(k){ const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : null; },
      del(k){ sessionStorage.removeItem(k); }
    };

    async function startAuth() {
      const codeVerifier = randString(96);
      const codeChallenge = await sha256(codeVerifier);
      store.set("pkce", { codeVerifier });

      const url = new URL(OIDC.auth);
      url.searchParams.set("client_id", clientId);
      url.searchParams.set("response_type", "code");
      url.searchParams.set("scope", scope);
      url.searchParams.set("redirect_uri", redirectUri);
      url.searchParams.set("code_challenge", codeChallenge);
      url.searchParams.set("code_challenge_method", "S256");

      window.location.replace(url.toString());
    }

    async function exchangeCode(code) {
      const pkce = store.get("pkce");
      if (!pkce || !pkce.codeVerifier) throw new Error("Falta code_verifier (PKCE).");

      const body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: clientId,
        code,
        redirect_uri: redirectUri,
        code_verifier: pkce.codeVerifier
      });

      const res = await fetch(OIDC.token, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data && (data.error_description || data.error)) || res.statusText);

      store.set("tokens", data);
      store.del("pkce");
      return data;
    }

    function showLoggedIn(tokens) {
      const idp = parseJWT(tokens.id_token || "");
      const atp = parseJWT(tokens.access_token || "");
      
      const roles = atp.realm_access?.roles || [];
      const username = idp.preferred_username || atp.preferred_username || "(desconocido)";
      const name = `${idp.given_name || ''} ${idp.family_name || ''}`.trim() || username;
      const email = idp.email || atp.email || "";

      document.getElementById("user-name").textContent = name;
      document.getElementById("user-email").textContent = email;
      document.getElementById("user-username").textContent = username;
      
      const rolesEl = document.getElementById("user-roles");
      rolesEl.innerHTML = roles.map(r => `<span class="role-badge">${r}</span>`).join("");

      userInfoEl.style.display = "block";
      setStatus(`Autenticado como: ${name}`, false);
    }

    async function main() {
      try {
        const url = new URL(window.location.href);
        const error = url.searchParams.get("error");
        const errorDescription = url.searchParams.get("error_description");

        if (error) {
          store.del("tokens");
          store.del("pkce");
          
          const errorMsg = errorDescription 
            ? decodeURIComponent(errorDescription) 
            : `Error de autenticación: ${error}`;
          setStatus(errorMsg, true);
          
          url.searchParams.delete("error");
          url.searchParams.delete("error_description");
          url.searchParams.delete("iss");
          window.history.replaceState({}, "", url.pathname);
          
          userInfoEl.style.display = "block";
          const retryBtn = document.createElement("button");
          retryBtn.textContent = "Reintentar Login";
          retryBtn.onclick = () => {
            store.del("tokens");
            store.del("pkce");
            startAuth();
          };
          statusEl.parentNode.insertBefore(retryBtn, statusEl.nextSibling);
          return;
        }

        const code = url.searchParams.get("code");

        if (code) {
          const tokens = await exchangeCode(code);
          url.searchParams.delete("code");
          url.searchParams.delete("session_state");
          window.history.replaceState({}, "", url.pathname);
          showLoggedIn(tokens);
          return;
        }

        const tokens = store.get("tokens");
        if (tokens?.access_token) {
          try {
            const atp = parseJWT(tokens.access_token);
            const now = Math.floor(Date.now() / 1000);
            if (atp.exp && atp.exp > now) {
              showLoggedIn(tokens);
              return;
            } else {
              store.del("tokens");
            }
          } catch {
            store.del("tokens");
          }
        }

        await startAuth();
      } catch (e) {
        console.error(e);
        setStatus("Error: " + e.message, true);
      }
    }

    document.getElementById("btn-refresh").onclick = async () => {
      try {
        const tokens = store.get("tokens");
        if (!tokens?.refresh_token) throw new Error("No hay refresh_token.");
        const body = new URLSearchParams({
          grant_type: "refresh_token",
          client_id: clientId,
          refresh_token: tokens.refresh_token
        });
        const res = await fetch(OIDC.token, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body
        });
        const data = await res.json();
        if (!res.ok) throw new Error((data && (data.error_description || data.error)) || res.statusText);
        store.set("tokens", { ...tokens, ...data });
        showLoggedIn(store.get("tokens"));
      } catch (e) {
        setStatus("Error refrescando token: " + e.message, true);
      }
    };

    document.getElementById("btn-logout").onclick = () => {
      const tokens = store.get("tokens");
      store.del("tokens");
      const url = new URL(OIDC.logout);
      if (tokens?.id_token) url.searchParams.set("id_token_hint", tokens.id_token);
      url.searchParams.set("post_logout_redirect_uri", redirectUri);
      window.location.assign(url.toString());
    };

    document.getElementById("link-proyectos").onclick = (e) => {
      e.preventDefault();
      window.location.href = "http://localhost:3000/proyectos/";
    };

    document.getElementById("link-admin").onclick = (e) => {
      e.preventDefault();
      window.location.href = "http://localhost:3000/admin/";
    };

    main();
  </script>
</body>
</html>
